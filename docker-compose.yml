services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer_local
      POSTGRES_DB: developer_social
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d developer_social"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
